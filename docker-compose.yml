services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fx_pulse
      POSTGRES_PASSWORD: fx_pulse
      POSTGRES_DB: fx_pulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fx_pulse -d fx_pulse"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build:
      context: .
      target: app
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fx_pulse:fx_pulse@postgres:5432/fx_pulse
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      target: app
    environment:
      DATABASE_URL: postgresql://fx_pulse:fx_pulse@postgres:5432/fx_pulse
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8501:8501"
    command:
      - uv
      - run
      - streamlit
      - run
      - fx_pulse/dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    restart: unless-stopped

  tests:
    build:
      context: .
      target: dev
    environment:
      DATABASE_URL: postgresql://fx_pulse:fx_pulse@postgres:5432/fx_pulse
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["test"]

volumes:
  pgdata:
