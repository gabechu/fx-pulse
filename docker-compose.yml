services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fx_pulse
      POSTGRES_PASSWORD: fx_pulse
      POSTGRES_DB: fx_pulse
    volumes:
      # Bind mount, not a named volume: the database travels with the repo
      # folder and survives any `docker ... prune`.
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fx_pulse -d fx_pulse"]
      interval: 2s
      timeout: 3s
      retries: 30
    # Explicit grace periods everywhere: this host's Docker stamps a 1s stop
    # timeout on containers by default, which SIGKILLs mid-shutdown.
    stop_grace_period: 30s
    restart: unless-stopped

  app:
    build:
      context: .
      target: app
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fx_pulse:fx_pulse@postgres:5432/fx_pulse
    depends_on:
      postgres:
        condition: service_healthy
    # SIGTERM exit rides the OANDA heartbeat cadence (~5s when market closed)
    stop_grace_period: 15s
    restart: unless-stopped

  predict:
    build:
      context: .
      target: app
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fx_pulse:fx_pulse@postgres:5432/fx_pulse
      FX_PULSE_MODEL_DIR: /app/data/models
    volumes:
      - ./data:/app/data:ro
    command: ["/app/.venv/bin/python", "-m", "fx_pulse.predict"]
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 15s
    restart: unless-stopped
    profiles: ["predict"]  # opt-in: only starts with `--profile predict`

  scheduler:
    build:
      context: .
      target: app
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fx_pulse:fx_pulse@postgres:5432/fx_pulse
    # supercronic reads ops/crontab and spawns `python -m fx_pulse.<job>`
    # at scheduled times. Each job persists a row to `job_runs` via
    # `fx_pulse.jobs.track_run`. In a managed environment this service can be
    # replaced by a scheduled task runner; the Python jobs don't change.
    command: ["supercronic", "/app/ops/crontab"]
    volumes:
      - ./ops:/app/ops:ro
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped
    profiles: ["scheduler"]  # opt-in: only starts with `--profile scheduler`

  # Throwaway database for the test suite: tmpfs-backed, no volume, its data
  # dies with the container. Tests must never see the real database.
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fx_pulse
      POSTGRES_PASSWORD: fx_pulse
      POSTGRES_DB: fx_pulse
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fx_pulse -d fx_pulse"]
      interval: 2s
      timeout: 3s
      retries: 30
    profiles: ["test"]

  tests:
    build:
      context: .
      target: dev
    environment:
      DATABASE_URL: postgresql://fx_pulse:fx_pulse@postgres-test:5432/fx_pulse
    depends_on:
      postgres-test:
        condition: service_healthy
    profiles: ["test"]

  grafana:
    image: grafana/grafana-oss:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 10s
    restart: unless-stopped

volumes:
  grafana-data:
