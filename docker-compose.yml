services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fx_pulse
      POSTGRES_PASSWORD: fx_pulse
      POSTGRES_DB: fx_pulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fx_pulse -d fx_pulse"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build:
      context: .
      target: app
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fx_pulse:fx_pulse@postgres:5432/fx_pulse
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  predict:
    build:
      context: .
      target: app
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fx_pulse:fx_pulse@postgres:5432/fx_pulse
      FX_PULSE_MODEL_DIR: /app/data/models
    volumes:
      - ./data:/app/data:ro
    command: ["uv", "run", "python", "-m", "fx_pulse.predict"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["predict"]  # opt-in: only starts with `--profile predict`

  tests:
    build:
      context: .
      target: dev
    environment:
      DATABASE_URL: postgresql://fx_pulse:fx_pulse@postgres:5432/fx_pulse
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["test"]

  grafana:
    image: grafana/grafana-oss:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  grafana-data:
