[project]
name = "fx-pulse"
version = "0.1.0"
description = "Real-time AUD/USD signal + dashboard, backed by IBKR"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ib_insync>=0.9.86",
    "pandas>=2.2",
    "streamlit>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fx_pulse"]
