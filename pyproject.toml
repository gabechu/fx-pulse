[project]
name = "fx-pulse"
version = "0.1.0"
description = "Real-time AUD/USD signal + dashboard, backed by OANDA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "oandapyV20>=0.7.2",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fx_pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
