[project]
name = "fx-pulse"
version = "0.1.0"
description = "Real-time AUD/USD signal + dashboard, backed by OANDA"
readme = "README.md"
requires-python = ">=3.10.1"
authors = [{ name = "gchu" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "apache-hamilton>=1.90.0",
    "joblib>=1.3",
    "numpy>=1.26",
    "oandapyV20>=0.7.2",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "requests>=2.31",
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = [
    "apache-hamilton[ui]>=1.90.0",
    "pytest>=8.0",
    "sf-hamilton-sdk>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fx_pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
